name: ci

on:
  push:
    branches: [master, 'dblock-*', 'skoed-*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: make build
        run: make build

      - name: go vet
        run: cd apps/skoed && go vet ./...

  acceptance:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: make build
        run: make build

      - name: make acceptance
        run: make acceptance

  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spec-lint
        run: tools/spec-lint/spec_lint.sh

  packaging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: make deb
        run: PATH="$(go env GOPATH)/bin:$PATH" make deb

      - name: make test-deb
        run: make test-deb

      - name: make apk
        run: PATH="$(go env GOPATH)/bin:$PATH" make apk

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.0'

      - name: Helm lint
        run: helm lint charts/skoed

      - name: Helm template
        run: helm template skoed charts/skoed | grep -c 'kind:' | xargs -I{} echo "{} Kubernetes resources rendered"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: mdbook build
        run: mdbook build docs
