name: ci

on:
  push:
    branches: [master, 'dblock-*', 'skoed-*', 'fix/*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: make build
        run: make build

      - name: go vet
        run: cd apps/skoed && go vet ./...

  acceptance:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: tests/acceptance/go.sum
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: make build
        run: make build

      - name: acceptance tests
        # Run directly on the host runner — each GitHub Actions run gets a fresh
        # VM so there is no socket-accumulation or kernel-state pollution.
        # Using Docker here would require downloading all Go modules from scratch
        # on every run (no shared cache between ephemeral runners).
        # -parallel 4: the suite spawns real processes per test; with 3-node
        # cluster tests, up to 12 skoed processes run concurrently. readyTimeout
        # in harness_test.go is 120s to cover CI runner disk-I/O contention.
        # -json + tee: structured output written to /tmp/acc.json for the
        # "show failures" step below; the python3 filter prints only FAIL lines.
        env:
          SKOED_BINARY: ${{ github.workspace }}/apps/skoed/skoed
        run: |
          cd tests/acceptance
          go test -timeout 1200s -parallel 4 -json ./... | tee /tmp/acc.json \
            | python3 -c "
          import sys, json
          for line in sys.stdin:
              try:
                  e = json.loads(line)
                  if e.get('Action') in ('fail','pass') and e.get('Test'):
                      print(f\"{e['Action'].upper()}: {e['Test']} ({e.get('Elapsed',0):.2f}s)\")
              except Exception:
                  pass
          "
          exit ${PIPESTATUS[0]}

      - name: show failing tests
        if: failure()
        run: |
          python3 -c "
          import json, sys
          fails = []
          with open('/tmp/acc.json') as f:
              for line in f:
                  try:
                      e = json.loads(line)
                      if e.get('Action') == 'fail' and e.get('Test'):
                          fails.append(f\"FAIL: {e['Test']} ({e.get('Elapsed',0):.1f}s)\")
                  except Exception:
                      pass
          print('\n'.join(fails) if fails else 'no individual test failures found (suite-level error)')
          " 2>/dev/null || echo "could not parse test output"

  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spec-lint
        run: tools/spec-lint/spec_lint.sh

  packaging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: web npm ci
        run: cd web && npm ci --no-audit --no-fund

      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: make deb
        run: PATH="$(go env GOPATH)/bin:$PATH" make deb

      - name: make test-deb
        run: make test-deb

      - name: make apk
        run: PATH="$(go env GOPATH)/bin:$PATH" make apk

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.0'

      - name: Helm lint
        run: helm lint charts/skoed

      - name: Helm template
        run: helm template skoed charts/skoed | grep -c 'kind:' | xargs -I{} echo "{} Kubernetes resources rendered"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: mdbook build
        run: mdbook build docs
