# goreleaser config — multi-arch (amd64 + arm64) tar.gz + .deb + Docker
# manifest. See specs/technical/multi-arch-builds.md (TS-MultiArchBuilds).

version: 2

builds:
  - id: skoed
    dir: apps/skoed
    main: ./cmd/skoed
    binary: skoed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - id: skoed
    name_template: "skoed_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE*
      - README*
      - packaging/config.example.yaml

nfpms:
  - id: skoed
    package_name: skoed
    file_name_template: "skoed_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/ashmonger/skoed
    description: |
      Self-hosted DNS filtering with multi-node sync.

      skoed is a drop-in alternative to Pi-hole / AdGuard-Home for
      households and small offices. Speaks plain DNS, DoH (RFC 8484),
      DoT (RFC 7858), and forms a Raft-replicated cluster.
    maintainer: skoed maintainers <maintainers@skoed.io>
    license: MIT
    formats:
      - deb
      - apk
    # Install the binary under the skoed-owned data dir (not /usr/bin) so the
    # in-place upgrade can atomically swap it as the unprivileged skoed user.
    # /usr/bin is root:root, so the swap there fails with permission-denied
    # under User=skoed; /var/lib/skoed/bin is skoed-owned and writable.
    bindir: /var/lib/skoed/bin
    section: net
    priority: optional
    dependencies:
      - adduser
    contents:
      - src: ./packaging/skoed.service
        dst: /lib/systemd/system/skoed.service
      - src: ./packaging/config.example.yaml
        dst: /etc/skoed/config.yaml
        type: config|noreplace
      - dst: /var/lib/skoed
        type: dir
        file_info:
          mode: 0700
          owner: skoed
          group: skoed
      - dst: /var/lib/skoed/bin
        type: dir
        file_info:
          mode: 0750
          owner: skoed
          group: skoed
      - dst: /var/log/skoed
        type: dir
        file_info:
          mode: 0750
          owner: skoed
          group: skoed
    scripts:
      preinstall: ./packaging/scripts/preinst.sh
      postinstall: ./packaging/scripts/postinst.sh
      preremove: ./packaging/scripts/prerm.sh
      postremove: ./packaging/scripts/postrm.sh

dockers:
  - id: skoed-amd64
    image_templates:
      - "ghcr.io/ashmonger/skoed:{{ .Version }}-amd64"
      - "ghcr.io/ashmonger/skoed:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64

  - id: skoed-arm64
    image_templates:
      - "ghcr.io/ashmonger/skoed:{{ .Version }}-arm64"
      - "ghcr.io/ashmonger/skoed:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/ashmonger/skoed:{{ .Version }}"
    image_templates:
      - "ghcr.io/ashmonger/skoed:{{ .Version }}-amd64"
      - "ghcr.io/ashmonger/skoed:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ashmonger/skoed:latest"
    image_templates:
      - "ghcr.io/ashmonger/skoed:latest-amd64"
      - "ghcr.io/ashmonger/skoed:latest-arm64"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: ashmonger
    name: skoed
  draft: false
  prerelease: auto
  extra_files:
    - glob: scripts/proxmox-create.sh
    - glob: extensions/skoed-firefox.zip
    - glob: extensions/skoed-chrome.zip

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 10
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 20
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^Merge'
