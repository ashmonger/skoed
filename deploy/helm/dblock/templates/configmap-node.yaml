apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dblock.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dblock.labels" . | nindent 4 }}
data:
  # Base cluster-replicated config (no node section — that's per-pod, written
  # by the pod's entrypoint wrapper after env-var expansion).
  cluster-sections.yaml: |
    schema_version: 1
    dns:
      mode: {{ .Values.dns.mode }}
      upstream_resolvers:
        {{- range .Values.dns.upstreamResolvers }}
        - {{ . | quote }}
        {{- end }}
      upstream_timeout_seconds: {{ .Values.dns.upstreamTimeoutSeconds }}
      cache:
        enabled: {{ .Values.dns.cache.enabled }}
        max_entries: {{ .Values.dns.cache.maxEntries }}
    filtering:
      block_policy: {{ .Values.filtering.blockPolicy }}
    query_log:
      max_entries: {{ .Values.queryLog.maxEntries }}
      aggregate_retention_days: {{ .Values.queryLog.aggregateRetentionDays }}

  # Per-pod entrypoint wrapper. On first start (no cluster.bbolt yet) it
  # synthesises a per-pod node section from env vars and merges with the
  # cluster sections from the ConfigMap. On every subsequent start, the
  # existing config.yaml is left untouched.
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    DATA=/var/lib/dblock
    CFG=$DATA/config.yaml
    if [ ! -f "$CFG" ]; then
      # First boot on this PVC: build config.yaml.
      cat > "$CFG" <<EOF
    schema_version: 1
    node:
      id: "$POD_NAME"
      raft_address: "$POD_IP:7000"
      api_address: "$POD_IP:8080"
      dns:
        listen:
          port: 53
          ipv4: true
          ipv6: true
      data_dir: "/var/lib/dblock"
    EOF
      # Append bootstrap section only when we have a token AND no existing
      # raft state — the binary's main.go will use it on first boot then
      # ignore it forever.
      if [ -n "${BOOTSTRAP_TOKEN:-}" ] && [ -n "${BOOTSTRAP_LEADER:-}" ] && [ ! -d "$DATA/raft" ]; then
        cat >> "$CFG" <<EOF
    bootstrap:
      leader_address: "$BOOTSTRAP_LEADER"
      token: "$BOOTSTRAP_TOKEN"
    EOF
      fi
      # Append the cluster-replicated sections from the ConfigMap.
      cat /config/cluster-sections.yaml >> "$CFG"
      chmod 0600 "$CFG"
    fi
    exec /usr/local/bin/dblock --config "$CFG"
