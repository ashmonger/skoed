apiVersion: v1
kind: Service
metadata:
  name: {{ include "dblock.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dblock.labels" . | nindent 4 }}
  {{- with .Values.service.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "dblock.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.api.port }}
      targetPort: 8080
      protocol: TCP
{{- if .Values.service.dns.nodePort.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dblock.fullname" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dblock.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "dblock.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
      nodePort: {{ .Values.service.dns.nodePort.udpPort }}
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
      nodePort: {{ .Values.service.dns.nodePort.tcpPort }}
{{- end }}
