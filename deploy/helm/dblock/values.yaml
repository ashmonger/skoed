image:
  repository: dblock
  tag: "0.2.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Bootstrap controls how follower pods enrol with the cluster's leader on
# their first start. When enabled, a Secret named <release>-bootstrap is
# rendered with a randomly-generated token plus the in-cluster Service URL
# of the leader. Disable when the operator manages the Secret out-of-band.
bootstrap:
  enabled: true
  token: ""    # leave empty for a per-install random token

# Cluster-replicated DNS settings (seeded into bbolt on first boot).
dns:
  mode: forwarding
  upstreamResolvers:
    - "9.9.9.9:53"
    - "149.112.112.112:53"
  upstreamTimeoutSeconds: 3
  cache:
    enabled: true
    maxEntries: 10000

filtering:
  blockPolicy: nxdomain   # nxdomain | null | nodata

queryLog:
  maxEntries: 10000
  aggregateRetentionDays: 30

persistence:
  enabled: true
  storageClassName: ""    # "" = cluster default
  size: 1Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  api:
    type: ClusterIP
    port: 8080
    annotations: {}
  dns:
    hostPort: true        # bind 53 on the K8s node
    nodePort:
      enabled: false      # set true on managed K8s where hostPort is forbidden
      udpPort: 30053
      tcpPort: 30053

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
podAnnotations: {}

serviceAccount:
  create: true
  name: ""               # falls back to the release name when empty
  annotations: {}
