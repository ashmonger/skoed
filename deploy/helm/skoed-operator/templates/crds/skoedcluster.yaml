apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skoedclusters.skoed.io
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/part-of: skoed-operator
spec:
  group: skoed.io
  names:
    kind: SkoedCluster
    listKind: SkoedClusterList
    plural: skoedclusters
    singular: skoedcluster
    shortNames:
      - sc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Leader
          type: string
          jsonPath: .status.leader
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
                - storage
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 7
                  default: 1
                image:
                  type: string
                storage:
                  type: object
                  required:
                    - size
                  properties:
                    size:
                      type: string
                      pattern: '^([0-9]+)(Ki|Mi|Gi|Ti|Pi|Ei|m|k|M|G|T|P|E)?$'
                    storageClass:
                      type: string
                dns:
                  type: object
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 53
                api:
                  type: object
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8080
                tls:
                  type: object
                  properties:
                    secretName:
                      type: string
                    acmeDomain:
                      type: string
                adminSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                leader:
                  type: string
                voters:
                  type: array
                  items:
                    type: string
                readyReplicas:
                  type: integer
                certExpiry:
                  type: string
                  format: date-time
