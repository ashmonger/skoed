# nfpm config for the skoed .deb / .rpm.
#
# Build with: make deb (root Makefile target). Multi-arch by overriding
# `arch:` and re-running, or via `nfpm pkg --arch arm64` etc.

name: skoed
arch: amd64
platform: linux
version: ${SKOED_VERSION}
release: 1
section: net
priority: optional
maintainer: skoed maintainers <maintainers@skoed.io>
description: |
  Self-hosted DNS filtering with multi-node sync.

  skoed is a drop-in alternative to Pi-hole / AdGuard-Home for
  households and small offices. It speaks plain DNS, DoH (RFC 8484),
  DoT (RFC 7858), and forms a Raft-replicated cluster for
  multi-node HA on commodity hardware.

vendor: skoed
homepage: https://github.com/skoed/skoed
license: MIT

depends:
  - adduser

contents:
  - src: ./apps/skoed/skoed
    dst: /usr/bin/skoed
    file_info:
      mode: 0755

  - src: ./packaging/skoed.service
    dst: /lib/systemd/system/skoed.service
    file_info:
      mode: 0644

  - src: ./packaging/config.example.yaml
    dst: /etc/skoed/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  - dst: /var/lib/skoed
    type: dir
    file_info:
      mode: 0700
      owner: skoed
      group: skoed

  - dst: /var/log/skoed
    type: dir
    file_info:
      mode: 0750
      owner: skoed
      group: skoed

scripts:
  preinstall: ./packaging/scripts/preinst.sh
  postinstall: ./packaging/scripts/postinst.sh
  preremove: ./packaging/scripts/prerm.sh
  postremove: ./packaging/scripts/postrm.sh
