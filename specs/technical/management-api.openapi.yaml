  - FS-BlocklistAddFromUrl
  - FS-BlocklistAddManual
  - FS-BlocklistRemove
  - FS-BlocklistDisable
  - FS-BlocklistEnable
  - FS-BlocklistRefresh
  - FS-BlocklistStats
  - FS-BlocklistWildcardEntry
  - FS-BlocklistParseHostsFormat
  - FS-BlocklistParseAdblockFormat
  - FS-AllowlistAddDomain
  - FS-AllowlistRemoveDomain
  - FS-AllowlistWildcardEntry
  - FS-BlockPolicyConfigurationGlobalDefault
  - FS-BlockPolicyConfigurationPerBlocklist
  - FS-BlockPolicyConfigurationChangeGlobal
  - FS-BlockPolicyConfigurationPerBlocklistReset
  - FS-LocalDnsEntryAddA
  - FS-LocalDnsEntryAddAAAA
  - FS-LocalDnsEntryAddCNAME
  - FS-LocalDnsEntryUpdate
  - FS-LocalDnsEntryDelete
  - FS-QueryLogRecordsEntry
  - FS-QueryLogBrowseAll
  - FS-QueryLogFilterByClient
  - FS-QueryLogFilterByOutcome
  - FS-QueryLogRetentionConfigurable
  - FS-ConfigExport
  - FS-ConfigImportOnFreshNode
  - FS-ConfigImportAtomic
