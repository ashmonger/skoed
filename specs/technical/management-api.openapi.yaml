  # ─── M18 — Rolling cluster upgrade ────────────────────────────────────────

  /api/v1/cluster/upgrade/apply:
    post:
      summary: Start a rolling cluster upgrade
      description: |
        Orchestrates a sequential rolling upgrade across all cluster nodes without
        losing quorum. Forwards to the leader via WriteForwardMiddleware.
        Returns 202 immediately; poll /api/v1/cluster/upgrade/status for progress.
      x-tsid: TS-RollingUpgrade
      x-fsid-links: [FS-RollingUpgradeOrchestrated, FS-RollingUpgradeLeadershipTransfer, FS-RollingUpgradeAbortOnFailure]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: "https://github.com/ashmonger/skoed/releases/download/v0.2.0/skoed_linux_amd64.tar.gz"
      responses:
        "202":
          description: Rolling upgrade accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  message:
                    type: string
        "400":
          description: url missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another upgrade already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Single-node cluster; use /api/v1/upgrade/start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/upgrade/status:
    get:
      summary: Get rolling upgrade status
      x-tsid: TS-RollingUpgrade
      x-fsid-links: [FS-RollingUpgradeStatus]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current rolling upgrade state
          content:
            application/json:
              schema:
                type: object
                properties:
                  in_progress:
                    type: boolean
                  pending_nodes:
                    type: array
                    items:
                      type: string
                  completed_nodes:
                    type: array
                    items:
                      type: string
                  failed_node:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices:
    get:
      summary: List all registered devices
      x-tsid: TS-DeviceRegistry
      x-fsid-links: [FS-DevicesViewShowsUnifiedTable]
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring filter on name, hostname, MAC, or IP
      responses:
        "200":
          description: List of registered devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Register a new named device
      x-tsid: TS-DeviceRegistry
      x-fsid-links: [FS-DeviceRegistryCreate, FS-DeviceRegistryNameUnique]
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Validation error (empty name, invalid MAC, unknown profile_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Device name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices/{id}:
    get:
      summary: Get a device by ID
      x-tsid: TS-DeviceRegistry
      x-fsid-links: [FS-DeviceRegistryCreate]
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Device not found
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update a device
      x-tsid: TS-DeviceRegistry
      x-fsid-links: [FS-DeviceRegistryUpdate]
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete a device
      x-tsid: TS-DeviceRegistry
      x-fsid-links: [FS-DeviceRegistryDelete]
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Device deleted
        "404":
          description: Device not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  components:
    responses:
      Unauthorized:
        description: Authentication required or credentials invalid
        headers:
          WWW-Authenticate:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
