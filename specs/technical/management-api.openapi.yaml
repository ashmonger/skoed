      x-fsid-links: [FS-FilterPauseGlobalSuspendsAllProfiles, FS-FilterPauseGlobalExpiresAutomatically, FS-FilterPauseGlobalCancelledEarly, FS-FilterPauseGlobalSurvivesRestart, FS-FilterPauseQueryLogMarkedDuringGlobalPause]
      responses:
        "200":
          description: Current global pause state (active or inactive)
