    post:
      summary: Activate a global filtering pause
      operationId: createFilterPause
      x-tsid: TS-FilterPause
      x-fsid-links: [FS-FilterPauseGlobalSuspendsAllProfiles, FS-FilterPauseGlobalEnforcedCeiling, FS-FilterPauseGlobalIdempotentWhileActive, FS-FilterPauseCeilingEnforced, FS-FilterPauseFeatureDisabledWhenCeilingZero]
      requestBody:
        required: true
        content:
          application/json:
