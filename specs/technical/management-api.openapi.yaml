      x-tsid: TS-FilterPause
      x-fsid-links: [FS-FilterPauseProfileSuspendsOneProfile, FS-FilterPauseProfileExpiresAutomatically, FS-FilterPauseProfileCancelledEarly, FS-FilterPauseQueryLogMarkedDuringProfilePause]
      responses:
        "200":
          description: Current pause state for this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterPauseState"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Activate a filtering pause for a specific profile
      operationId: createProfilePause
      x-tsid: TS-FilterPause
      x-fsid-links: [FS-FilterPauseProfileSuspendsOneProfile, FS-FilterPauseProfileDoesNotAffectOtherProfiles, FS-FilterPauseProfileMultipleSimultaneous, FS-FilterPauseGlobalOverridesProfile, FS-FilterPauseCeilingEnforced, FS-FilterPauseFeatureDisabledWhenCeilingZero]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterPauseRequest"
      responses:
        "200":
          description: Profile pause activated (or replaced if one was already active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterPauseState"
        "400":
          description: duration_seconds exceeds filtering.pause_max_seconds, or feature is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      summary: Cancel an active pause for a specific profile
      operationId: deleteProfilePause
      x-tsid: TS-FilterPause
      x-fsid-links: [FS-FilterPauseProfileCancelledEarly]
      responses:
        "204":
          description: Profile pause cancelled; filtering is immediately restored for that profile's clients
        "404":
          description: Profile not found or no active pause on this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

