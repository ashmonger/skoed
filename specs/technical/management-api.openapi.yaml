info:
  title: skoed Management API
  version: "2.0.0"
  x-cluster-write-semantics: |
    As of M2, every mutating endpoint under /api/v1 (blocklists, allowlist,
    local-dns, settings, config/import, auth) is cluster-aware:

      * If the receiving node is the Raft leader, the write is applied through
        the FSM, replicated, and the response is returned once it commits.
      * If the receiving node is a follower, the request is transparently
        forwarded to the current leader over the same HTTP API. The admin
        sees no difference; only the latency is slightly higher.
      * If no leader is currently elected (e.g. minority partition), the call
        returns HTTP 503 with a LeaderRedirect body whose `leader_id` is empty.

    Read endpoints (GET) are always served locally from bbolt without
    forwarding, so they remain available during leader transitions.

    See specs/technical/raft-fsm.md for the FSM command set and write path.
  description: >
    REST API for managing a skoed node. All endpoints require HTTP Basic
    authentication except POST /api/v1/auth/setup (first-run only).
    DNS port 53 is never gated by this API's authentication.

servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8080"

security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:

    Device:
      type: object
      required: [id, name, profile_id]
      properties:
        id:
          type: string
          description: URL-safe slug generated from name
        name:
          type: string
          maxLength: 64
          description: Human-readable device name, unique across all devices
        profile_id:
          type: string
          description: ID of the profile to apply when this device is matched
        macs:
          type: array
          items:
            type: string
          description: MAC addresses (aa:bb:cc:dd:ee:ff format)
        ips:
          type: array
          items:
            type: string
          description: IPv4 or IPv6 addresses
        hostnames:
          type: array
          items:
            type: string
          description: Hostnames (exact match)
        client_ids:
          type: array
          items:
            type: string
          description: DHCP client identifiers

    DeviceCreate:
      type: object
      required: [name, profile_id]
      properties:
        name:
          type: string
          maxLength: 64
        profile_id:
          type: string
        macs:
          type: array
          items:
            type: string
        ips:
          type: array
          items:
            type: string
        hostnames:
          type: array
          items:
            type: string
        client_ids:
          type: array
          items:
            type: string

    DevicePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        profile_id:
          type: string
        macs:
          type: array
          items:
            type: string
          description: Full replacement array for MACs
        ips:
          type: array
          items:
            type: string
          description: Full replacement array for IPs
        hostnames:
          type: array
          items:
            type: string
          description: Full replacement array for hostnames
        client_ids:
          type: array
          items:
            type: string
          description: Full replacement array for client IDs

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    FilterPauseRequest:
      type: object
      required: [duration_seconds]
      properties:
        duration_seconds:
          type: integer
          minimum: 1
          description: How long to pause filtering. Must not exceed filtering.pause_max_seconds.
        reason:
          type: string
          description: Optional operator note stored with the pause state.

    FilterPauseState:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        resumes_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the pause will expire. Present only when active=true.
        reason:
          type: string
          description: Reason string provided when the pause was created. Present only when active=true.

    BlocklistSource:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [url, inline]
        url:
          type: string
          format: uri
          description: Required when type=url.
        format:
          type: string
          enum: [auto, hosts, domainlist, askoed]
          default: auto

    Blocklist:
      type: object
      required: [id, name, source]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
        name:
          type: string
        enabled:
          type: boolean
          default: true
        source:
          $ref: "#/components/schemas/BlocklistSource"
        block_policy:
          type: string
          enum: [nxdomain, "null", nodata, ""]
          default: ""
          description: Empty string inherits the global default.
        domain_count:
          type: integer
          readOnly: true
        last_updated:
          type: string
          format: date-time
          readOnly: true

    BlocklistCreate:
      type: object
      required: [id, name, source]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
        name:
          type: string
        enabled:
          type: boolean
          default: true
        source:
          $ref: "#/components/schemas/BlocklistSource"
        domains:
          type: array
          items:
            type: string
          description: Required when source.type=inline.
        block_policy:
          type: string
          enum: [nxdomain, "null", nodata, ""]
          default: ""

    LocalDnsEntry:
      type: object
      required: [hostname, type, value]
      properties:
        id:
          type: string
          readOnly: true
        hostname:
          type: string
        type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
          description: IPv4 address for A, IPv6 for AAAA, FQDN for CNAME.
        ttl:
          type: integer
          default: 300
          minimum: 1
          maximum: 86400

    QueryLogEntry:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
        client:
          type: string
          description: Client IP address (IPv4 or IPv6).
        domain:
          type: string
        query_type:
          type: string
          description: DNS record type (A, AAAA, MX, etc.)
        outcome:
          type: string
          enum: [forwarded, blocked, local, cached]
        blocklist_id:
          type: string
          description: Set when outcome=blocked. ID of the matching blocklist.

    Settings:
      type: object
      properties:
        dns:
          type: object
          properties:
            mode:
              type: string
              enum: [forwarding, recursive]
            upstream_resolvers:
              type: array
              items:
                type: string
            upstream_timeout_seconds:
              type: integer
              minimum: 1
              maximum: 30
            trusted_subnets:
              type: array
              items:
                type: string
            cache:
              type: object
              properties:
                enabled:
                  type: boolean
                max_entries:
                  type: integer
        filtering:
          type: object
          properties:
            block_policy:
              type: string
              enum: [nxdomain, "null", nodata]
        query_log:
          type: object
          properties:
            max_entries:
              type: integer
              minimum: 1
              maximum: 1000000
        auth:
          type: object
          description: Authentication and session settings.
          properties:
            session_timeout_seconds:
              type: integer
              minimum: 1
              maximum: 604800
              default: 28800
              description: >
                How long a web UI session remains valid after login, in seconds.
                Applies to new sessions only — existing sessions keep their
                original expiry. Default: 28800 (8 hours). Maximum: 604800 (7 days).
                Preset options in the web UI: 1800 (30 min), 3600 (1 h), 14400 (4 h),
                28800 (8 h), 86400 (24 h), 604800 (7 d).

    # SettingsPatch is the request body for PATCH /api/v1/settings.
    # All fields are optional; omitted fields are left unchanged.
    SettingsPatch:
      type: object
      properties:
        dns:
          type: object
          properties:
            mode:
              type: string
              enum: [forwarding, recursive]
            upstream_resolvers:
              type: array
              items:
                type: string
            upstream_timeout_seconds:
              type: integer
              minimum: 1
              maximum: 30
            trusted_subnets:
              type: array
              items:
                type: string
            cache:
              type: object
              properties:
                enabled:
                  type: boolean
                max_entries:
                  type: integer
        filtering:
          type: object
          properties:
            block_policy:
              type: string
              enum: [nxdomain, "null", nodata]
        query_log:
          type: object
          properties:
            max_entries:
              type: integer
              minimum: 1
              maximum: 1000000
        auth:
          type: object
          properties:
            session_timeout_seconds:
              type: integer
              minimum: 1
              maximum: 604800
              description: New session TTL in seconds (1–604800). Applies to sessions created after the change.

    # --- M2 cluster schemas ---

    LeaderRedirect:
      type: object
      required: [error, leader_address]
      properties:
        error:
          type: string
          example: "not the leader"
        leader_id:
          type: string
        leader_address:
          type: string
          example: "192.168.1.10:8080"

    ClusterNode:
      type: object
      required: [node_id, role, raft_address, api_address, last_contact, commit_index, sync_state]
      properties:
        node_id:
          type: string
        role:
          type: string
          enum: [leader, follower, learner, removed]
        raft_address:
          type: string
        api_address:
          type: string
        last_contact:
          type: string
          format: date-time
        commit_index:
          type: integer
        sync_state:
          type: string
          enum: [in_sync, behind, unreachable]
          description: |
            in_sync     — commit_index matches the leader
            behind      — commit_index < leader's, follower is still catching up
            unreachable — no Raft heartbeat for > 3× heartbeat interval

    ClusterStatus:
      type: object
      required: [cluster_id, raft_term, leader_id, nodes]
      properties:
        cluster_id:
          type: string
        raft_term:
          type: integer
        leader_id:
          type: string
          description: Empty string if no leader is currently elected
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ClusterNode"

    HourlyAggregate:
      type: object
      required: [node_id, hour_start, total, blocked, forwarded, cached, local, top_domains, top_clients]
      properties:
        node_id:
          type: string
        hour_start:
          type: string
          format: date-time
        total:
          type: integer
        blocked:
          type: integer
        forwarded:
          type: integer
        cached:
          type: integer
        local:
          type: integer
        top_domains:
          type: array
          items:
            type: object
            required: [domain, count]
            properties:
              domain:
                type: string
              count:
                type: integer
        top_clients:
          type: array
          items:
            type: object
            required: [client, count]
            properties:
              client:
                type: string
              count:
                type: integer

    ClusterStats:
      type: object
      required: [window_from, window_to, per_node, cluster_totals, top_domains, top_clients]
      properties:
        window_from:
          type: string
          format: date-time
        window_to:
          type: string
          format: date-time
        per_node:
          type: array
          items:
            $ref: "#/components/schemas/HourlyAggregate"
        cluster_totals:
          type: object
          required: [total, blocked, forwarded, cached, local]
          properties:
            total:
              type: integer
            blocked:
              type: integer
            forwarded:
              type: integer
            cached:
              type: integer
            local:
              type: integer
        top_domains:
          type: array
          description: Top-N domains summed across all nodes in the window
          items:
            type: object
            required: [domain, count]
            properties:
              domain:
                type: string
              count:
                type: integer
        top_clients:
          type: array
          items:
            type: object
            required: [client, count]
            properties:
              client:
                type: string
              count:
                type: integer

    ClusterQueryLog:
      type: object
      required: [entries, total, per_node]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [node_id, timestamp, client, domain, query_type, outcome]
            properties:
              node_id:
                type: string
                description: Identifies which node served this query
              timestamp:
                type: string
                format: date-time
              client:
                type: string
              domain:
                type: string
              query_type:
                type: string
              outcome:
                type: string
              blocklist_id:
                type: string
        total:
          type: integer
          description: Total matching entries across all reachable nodes
        per_node:
          type: array
          description: Per-node fan-out result, including unreachable nodes
          items:
            type: object
            required: [node_id, status]
            properties:
              node_id:
                type: string
              status:
                type: string
                enum: [ok, timeout, error]
              entry_count:
                type: integer
              error:
                type: string

    Schedule:
      type: object
      required: [id, name, mode]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [block_only_inside, allow_only_inside]
          description: >
            block_only_inside — filtering is applied only while inside the windows;
            allow_only_inside — filtering is applied only while outside the windows.
        windows:
          type: array
          items:
            $ref: "#/components/schemas/TimeWindow"

    TimeWindow:
      type: object
      required: [days, start, end]
      properties:
        days:
          type: array
          items:
            type: string
            enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        start:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: "HH:MM in 24-hour local time"
        end:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: "HH:MM in 24-hour local time; values < start wrap past midnight"

    ScheduleBinding:
      type: object
      required: [schedule_id, profile_id, blocklist_id]
      properties:
        schedule_id:
          type: string
        profile_id:
          type: string
        blocklist_id:
          type: string

paths:

  # ── Blocklists ────────────────────────────────────────────────────────────

  /api/v1/blocklists:
    get:
      summary: List all blocklists
      operationId: listBlocklists
      responses:
        "200":
          description: Array of blocklists with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blocklist"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Add a blocklist
      operationId: createBlocklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlocklistCreate"
      responses:
        "201":
          description: Blocklist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocklist"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Blocklist with this ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/blocklists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get a blocklist by ID
      operationId: getBlocklist
      responses:
        "200":
          description: Blocklist details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocklist"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      summary: Update a blocklist (enable/disable, change policy, rename)
      operationId: updateBlocklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                enabled:
                  type: boolean
                block_policy:
                  type: string
                  enum: [nxdomain, "null", nodata, ""]
      responses:
        "200":
          description: Updated blocklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocklist"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      summary: Remove a blocklist
      operationId: deleteBlocklist
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/blocklists/{id}/refresh:
    post:
      summary: Manually refresh a URL-sourced blocklist
      operationId: refreshBlocklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refresh triggered; returns updated blocklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocklist"
        "400":
          description: Blocklist is not URL-sourced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Allowlist ─────────────────────────────────────────────────────────────

  /api/v1/allowlist:
    get:
      summary: List all allowlist entries
      operationId: listAllowlist
      responses:
        "200":
          description: Array of domain strings (exact or wildcard)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Add a domain to the allowlist
      operationId: addAllowlistEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "201":
          description: Entry added
        "400":
          description: Invalid domain format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Entry already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/allowlist/{domain}:
    delete:
      summary: Remove a domain from the allowlist
      operationId: deleteAllowlistEntry
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Local DNS ─────────────────────────────────────────────────────────────

  /api/v1/local-dns:
    get:
      summary: List all local DNS entries
      operationId: listLocalDns
      responses:
        "200":
          description: Array of local DNS entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalDnsEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Add a local DNS entry
      operationId: createLocalDns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalDnsEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDnsEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/local-dns/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    put:
      summary: Replace a local DNS entry
      operationId: updateLocalDns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalDnsEntry"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalDnsEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      summary: Delete a local DNS entry
      operationId: deleteLocalDns
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Query Log ─────────────────────────────────────────────────────────────

  /api/v1/query-log:
    get:
      summary: Browse the query log
      operationId: listQueryLog
      parameters:
        - name: client
          in: query
          schema:
            type: string
          description: Filter by client IP address.
        - name: outcome
          in: query
          schema:
            type: string
            enum: [forwarded, blocked, local, cached]
          description: Filter by outcome.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Maximum number of entries to return.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset.
      responses:
        "200":
          description: Array of log entries, reverse chronological order
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueryLogEntry"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Settings ──────────────────────────────────────────────────────────────

  /api/v1/settings:
    get:
      summary: Get current settings
      operationId: getSettings
      x-tsid: TS-Settings
      x-fsid-links:
        - FS-SessionTimeoutViewCurrentSetting
        - FS-SessionTimeoutDefaultApplied
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      summary: Update settings
      operationId: updateSettings
      x-tsid: TS-Settings
      x-fsid-links:
        - FS-SessionTimeoutSetCustomDuration
        - FS-SessionTimeoutExistingSessionsUnaffected
        - FS-SessionTimeoutPersistsAcrossRestart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
