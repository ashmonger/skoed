        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Config Import / Export ────────────────────────────────────────────────

  /api/v1/config/export:
    get:
      summary: Export the full configuration as YAML
      description: >
        Returns the same content the node writes to its on-disk shadow YAML at
        `<data_dir>/config.yaml` (see cluster-store.md § Shadow YAML).
        Filesystem-level backup tools (e.g. Proxmox Backup Server) can read
        the shadow YAML directly without calling this endpoint; both forms
        are byte-identical at any quiescent moment.
      operationId: exportConfig
      x-fsid-links:
        - FS-ConfigExport
        - FS-ConfigShadowYamlPresentOnDisk
        - FS-ConfigBackupWebUiDownload
        - FS-ConfigBackupWebUiRoundTrip
      responses:
        "200":
          description: Configuration YAML
          content:
            application/x-yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/config/import:
    post:
      summary: Import a configuration archive
      description: >
        Restores configuration from a tar.gz archive. Node-local settings (DNS
        listen address, API port, admin credentials) are preserved; they are never
        overwritten by an imported backup. Admin credentials in the backup are
        silently ignored.
      operationId: importConfig
      x-fsid-links:
        - FS-ConfigImportOnFreshNode
        - FS-ConfigImportAtomic
        - FS-ConfigImportOverwritesExisting
        - FS-ConfigBackupWebUiImport
        - FS-ConfigBackupWebUiRoundTrip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                  description: tar.gz archive produced by the export endpoint.
      responses:
        "200":
          description: Import successful
        "400":
          description: Archive invalid, corrupt, or schema validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Authentication ────────────────────────────────────────────────────────

  /api/v1/auth/setup:
    post:
      summary: Set credentials on first run (no auth required)
      operationId: authSetup
      security: []
      description: >
        Available only when no credentials have been configured yet (first run).
        Returns 409 if credentials are already set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Credentials set
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Credentials already configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/password:
    put:
      summary: Change the admin password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "204":
          description: Password changed
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # =========================================================================
  # M2 — Cluster endpoints
  # =========================================================================

  /api/v1/cluster/tokens:
    post:
      summary: Generate a single-use join token
      description: >
        Issued by any cluster node; persisted in bbolt (replicated via Raft) so
        that any node can validate a token regardless of which node issued it.
      operationId: createJoinToken
      x-tsid: TS-ClusterApi
      x-fsid-links:
        - FS-NodeEnrollmentGenerateToken
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, leader_address]
                properties:
                  token:
                    type: string
                    description: Opaque bearer string (32+ bytes, URL-safe base64)
                  expires_at:
                    type: string
                    format: date-time
                    description: 15 minutes after issuance
                  leader_address:
                    type: string
                    example: "192.168.1.10:8080"
                    description: Current Raft leader's reachable API address; the joining node uses this address to submit its enrollment
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/join:
    post:
      summary: Enroll a fresh node into the cluster
      description: >
        Called by a node with empty cluster state. The receiving node MUST be a
        Raft voter (typically the leader). The token is validated against the
        replicated token bucket; on success the leader issues a Raft
        AddVoter membership change and waits for the new node to catch up.
      operationId: clusterJoin
      x-tsid: TS-ClusterApi
      x-fsid-links:
        - FS-NodeEnrollmentJoinWithValidToken
        - FS-NodeEnrollmentJoinTokenIsSingleUse
        - FS-NodeEnrollmentJoinTokenExpires
        - FS-NodeEnrollmentInvalidToken
        - FS-NodeEnrollmentPreservesNodeLocalSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, node_id, raft_address]
              properties:
                token:
                  type: string
                node_id:
                  type: string
                  description: Stable identifier the joining node will use in Raft
                raft_address:
                  type: string
                  example: "192.168.1.11:7000"
                  description: Address the leader will dial to send Raft RPCs to the new node
      responses:
        "200":
          description: Enrollment accepted; node has been added as a Raft voter
          content:
            application/json:
              schema:
                type: object
                required: [cluster_id, commit_index_at_join]
                properties:
                  cluster_id:
                    type: string
                  commit_index_at_join:
                    type: integer
                    description: Raft index the joining node must reach before serving traffic
        "400":
          description: Validation error (malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token rejected — invalid, expired, or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not the leader; response body carries the leader address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderRedirect"

  /api/v1/node/join-cluster:
    post:
      summary: Request this node to join an existing cluster
      description: >
        Follower-initiated self-join. The caller supplies the join payload produced
        by the leader's "Generate token" button (token + leader_address). The node
        reads its own node_id, raft_address, and api_address from its local
        configuration and forwards a join request to the leader on behalf of itself.
        This endpoint powers the web UI "Join an existing cluster" flow: the
        administrator pastes the payload and clicks Join; no SSH access is needed.
      operationId: nodeSelfJoin
      x-tsid: TS-ClusterJoinWebUi
      x-fsid-links:
        - FS-ClusterJoinWebUiFollowerDialog
        - FS-ClusterJoinWebUiExpiredToken
        - FS-ClusterJoinWebUiInvalidPayload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, leader_address]
              properties:
                token:
                  type: string
                  description: Opaque join token generated by the leader
                leader_address:
                  type: string
                  description: "API base URL of the leader, e.g. http://192.168.1.10:8080"
      responses:
        "200":
          description: Joined successfully; this node is now a cluster member
          content:
            application/json:
              schema:
                type: object
                required: [cluster_id]
                properties:
                  cluster_id:
                    type: string
        "400":
          description: Malformed payload (missing fields or invalid JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token rejected by the leader — invalid, expired, or consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This node is already a cluster member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Leader unreachable or returned an unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/status:
    get:
      summary: Cluster topology and Raft state
      operationId: getClusterStatus
      x-tsid: TS-ClusterApi
      x-fsid-links:
        - FS-ClusterStatusListsAllNodes
        - FS-ClusterStatusShowsCommitIndex
        - FS-ClusterStatusShowsLaggingFollower
        - FS-ClusterStatusShowsUnreachableFollower
        - FS-ClusterStatusSameViewFromAnyNode
        - FS-ClusterStatusShowsRaftTerm
      responses:
        "200":
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/leadership/transfer:
    post:
      summary: Transfer leadership to a specific node
      description: >
        Triggers a Raft leadership transfer to the named follower. The call
        returns once the transfer has completed or timed out.
      operationId: transferLeadership
      x-tsid: TS-ClusterApi
      x-fsid-links:
        - FS-LeaderFailoverManualTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_node_id]
              properties:
                target_node_id:
                  type: string
      responses:
        "204":
          description: Leadership transferred
        "409":
          description: Not the leader OR target not in cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderRedirect"
        "504":
          description: Transfer did not complete within the deadline

  /api/v1/cluster/nodes/{node_id}:
    delete:
      summary: Remove a node from the cluster
      description: >
        Issues a Raft RemoveServer change. The leader rejects requests to
        remove itself; admin must transfer leadership first.
      operationId: removeNode
      x-tsid: TS-ClusterApi
      x-fsid-links:
        - FS-NodeRemoval
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Node removed
        "409":
          description: Cannot remove the leader (transfer first)
        "404":
          description: Node not in cluster

  /api/v1/cluster/stats:
    get:
      summary: Cluster-wide aggregated query stats
      description: >
        Returns the union of hourly aggregates committed by every node. Served
        from local bbolt (replicated by Raft) so the call succeeds even when
        the leader is unreachable.
      operationId: getClusterStats
      x-tsid: TS-QueryLogCluster
      x-fsid-links:
        - FS-QueryLogAggregatesClusterStats
        - FS-QueryLogAggregatesAvailableDuringLeaderLoss
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: top_n
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/query-log:
    get:
      summary: Cluster-wide raw query log via fan-out
      description: >
        Fans out the request to every node in the cluster in parallel; merges
        results sorted by timestamp descending. Each entry is tagged with the
        node id that originally served the query. Unreachable nodes are
        reported in the response but do not fail the call.
      operationId: getClusterQueryLog
      x-tsid: TS-QueryLogCluster
      x-fsid-links:
        - FS-QueryLogAggregatesFanOutForRawEntries
        - FS-QueryLogAggregatesFanOutPartialFailure
      parameters:
        - in: query
          name: client
          schema:
            type: string
        - in: query
          name: outcome
          schema:
            type: string
            enum: [forwarded, blocked, local, cached]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: timeout_ms
          schema:
            type: integer
            default: 2000
            description: Per-node deadline for the fan-out
      responses:
        "200":
          description: Merged entries plus per-node status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterQueryLog"
        "401":
          $ref: "#/components/responses/Unauthorized"

